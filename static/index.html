<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>House Price Predictor</title>
<style>
  :root { --bg:#f4f6fb; --card:#fff; --ink:#1f2937; --muted:#6b7280; --accent:#2563eb; --line:#d1d5db; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f172a; --card:#1e293b; --ink:#e5e7eb; --muted:#94a3b8; --accent:#3b82f6; --line:#334155; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; padding:16px; }
  .card { background:var(--card); width:100%; max-width:440px; padding:28px; border-radius:16px;
          box-shadow:0 8px 30px rgba(0,0,0,.10); }
  h1 { margin:0 0 4px; font-size:1.4rem; }
  p.sub { margin:0 0 20px; color:var(--muted); font-size:.9rem; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  label { display:block; font-size:.8rem; color:var(--muted); margin-bottom:4px; }
  input { width:100%; padding:10px; border:1px solid var(--line); border-radius:8px;
          background:transparent; color:var(--ink); font-size:1rem; }
  input:focus { outline:2px solid var(--accent); border-color:transparent; }
  button { width:100%; margin-top:18px; padding:12px; border:0; border-radius:10px;
           background:var(--accent); color:#fff; font-size:1rem; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  #result { margin-top:18px; padding:14px; border-radius:10px; text-align:center; display:none; font-size:1.1rem; }
  #result.ok { display:block; background:rgba(37,99,235,.12); }
  #result.err { display:block; background:rgba(220,38,38,.12); color:#dc2626; font-size:.95rem; }
</style>
</head>
<body>
<div class="card">
  <h1>House Price Predictor</h1>
  <p class="sub">Ghar ki details bharo aur predicted price dekho.</p>
  <div class="grid">
    <div><label for="sqft">Area (sqft)</label><input id="sqft" type="number" min="1" value="1800"></div>
    <div><label for="bedrooms">Bedrooms</label><input id="bedrooms" type="number" min="1" value="3"></div>
    <div><label for="bathrooms">Bathrooms</label><input id="bathrooms" type="number" min="1" value="2"></div>
    <div><label for="age_years">Age (years)</label><input id="age_years" type="number" min="0" value="5"></div>
    <div><label for="garage">Garage</label><input id="garage" type="number" min="0" value="1"></div>
    <div><label for="location_score">Location score (1-10)</label><input id="location_score" type="number" min="1" max="10" value="7"></div>
  </div>
  <button id="btn" type="button">Predict Price</button>
  <div id="result"></div>
</div>
<script>
  const fields = ["sqft","bedrooms","bathrooms","age_years","garage","location_score"];
  const btn = document.getElementById("btn");
  const result = document.getElementById("result");

  btn.addEventListener("click", async () => {
    const payload = {};
    fields.forEach(f => payload[f] = Number(document.getElementById(f).value));
    btn.disabled = true;
    result.className = "";
    try {
      const res = await fetch("/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : "Input values check karo");
      result.className = "ok";
      result.textContent = "Predicted price: " + data.predicted_price.toLocaleString("en-IN");
    } catch (e) {
      result.className = "err";
      result.textContent = e.message;
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
